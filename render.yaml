services:
  - type: web
    name: outbox-mail
    env: node
    plan: free
    rootDir: employee-management-system
    buildCommand: npm install --prefix backend && npm install --prefix frontend && npm run build --prefix frontend && cd backend && npx prisma generate && npx prisma db push
    startCommand: node backend/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@company.com
      - key: ADMIN_PASSWORD
        value: Admin@123
