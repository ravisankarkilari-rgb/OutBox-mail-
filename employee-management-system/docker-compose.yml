version: '3.8'

services:
  outbox-mail:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: outbox_mail_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=outbox-super-secret-jwt-key-production-2026
      - JWT_EXPIRES_IN=7d
      - JWT_REFRESH_SECRET=outbox-super-secret-refresh-key-production-2026
      - JWT_REFRESH_EXPIRES_IN=30d
      - ADMIN_EMAIL=admin@company.com
      - ADMIN_PASSWORD=Admin@123
    volumes:
      - outbox_data:/app/backend/prisma

volumes:
  outbox_data:

